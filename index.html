<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>3D Bus Route Simulator — Balangoda</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="./lib/maplibre-gl.css" />
    <link rel="stylesheet" href="simulator_3d.css" />
  </head>
  <body>
    <div id="pwa-splash" role="status" aria-live="polite">
      <!-- Scene Container -->
      <div class="bus-scene">
        <div class="splash-bus">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 512 512"
            width="100%"
            height="100%"
          >
            <defs>
              <mask id="bus-cutouts">
                <rect width="512" height="512" fill="#ffffff" />
                <path
                  d="M 103 66 Q 256 62 409 66 Q 421 68 421 86 L 421 107 Q 421 115 413 115 L 99 115 Q 91 115 91 107 L 91 86 Q 91 68 103 66 Z"
                  fill="black"
                />
                <rect
                  x="81"
                  y="125"
                  width="350"
                  height="164"
                  rx="12"
                  fill="#000000"
                />
                <rect
                  x="65"
                  y="332"
                  width="76"
                  height="26"
                  rx="5"
                  fill="#000000"
                />
                <rect
                  x="371"
                  y="332"
                  width="76"
                  height="26"
                  rx="5"
                  fill="black"
                />
              </mask>
              <clipPath id="windshield-clip">
                <rect x="81" y="125" width="350" height="167" rx="12" />
              </clipPath>
            </defs>

            <!-- Wheels / Tyres -->
            <g id="bus-wheels" fill="currentColor">
              <path
                id="wheel-left"
                d="M 76 392 L 126 392 L 126 452 Q 126 465 113 465 L 89 465 Q 76 465 76 452 Z"
              />
              <path
                id="wheel-right"
                d="M 386 392 L 436 392 L 436 452 Q 436 465 423 465 L 399 465 Q 386 465 386 452 Z"
              />
            </g>

            <!-- Bus Body & Wipers -->
            <g id="bus-body" fill="currentColor">
              <g mask="url(#bus-cutouts)">
                <path
                  id="chassis"
                  d="M 96 52 Q 256 44 416 52 Q 441 55 441 88 L 441 392 Q 441 414 419 414 L 93 414 Q 71 414 71 392 L 71 88 Q 71 55 96 52 Z"
                />
                <rect
                  id="mirror-left"
                  x="36"
                  y="135"
                  width="30"
                  height="80"
                  rx="6"
                />
                <rect x="62" y="148" width="12" height="14" />
                <rect
                  id="mirror-right"
                  x="446"
                  y="135"
                  width="30"
                  height="80"
                  rx="6"
                />
                <rect x="438" y="148" width="12" height="14" />
              </g>

              <g
                id="wipers"
                clip-path="url(#windshield-clip)"
                stroke="currentColor"
                stroke-linecap="round"
                fill="currentColor"
              >
                <g id="wiper-left">
                  <line x1="130" y1="292" x2="162" y2="274" stroke-width="9" />
                  <line x1="130" y1="276" x2="289" y2="269" stroke-width="10" />
                </g>
                <g id="wiper-right">
                  <line x1="382" y1="292" x2="348" y2="278" stroke-width="9" />
                  <line x1="234" y1="278" x2="387" y2="279" stroke-width="10" />
                </g>
              </g>
            </g>
          </svg>
        </div>
      </div>

      <div class="splash-title">3D Bus Route Simulator</div>
      <div id="splash-status-text" class="splash-status">
        Loading offline routes...
      </div>
    </div>

    <div id="pwa-install-banner" role="region" aria-label="Install App">
      <div id="pwa-banner-text"></div>
      <div class="pwa-banner-actions">
        <button id="pwa-install-btn">Install</button>
        <button id="pwa-close-btn" aria-label="Dismiss install banner">
          &times;
        </button>
      </div>
    </div>

    <!-- MapLibre GL JS Background Map -->
    <div id="map"></div>

    <!-- High-Accuracy Geolocation Button (Bottom-Left) -->
    <button
      id="geoLocationBtn"
      class="geo-btn"
      title="High-Accuracy Location"
      aria-label="High-Accuracy Location"
    >
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
        <!-- Font Awesome Free 5.15.4 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free (Icons: CC BY 4.0, Fonts: SIL OFL 1.1, Code: MIT License) -->
        <path
          d="M444.52 3.52L28.74 195.42c-47.97 22.39-31.98 92.75 19.19 92.75h175.91v175.91c0 51.17 70.36 67.17 92.75 19.19l191.9-415.78c15.99-38.39-25.59-79.97-63.97-63.97z"
          fill="currentColor"
        />
      </svg>
    </button>

    <!-- Top Telemetry & Controls HUD -->
    <div class="hud-top">
      <div class="hud-brand">
        <span class="live-indicator"></span>
        <span
          id="overspeedIndicator"
          class="overspeed-indicator"
          title="Overspeed Warning (> 90 km/h)"
          aria-label="Overspeed Warning"
        ></span>
        <div>
          <h1 id="routeTitle">Live 3D Bus</h1>
          <select id="routeSubtitle" class="route-select">
            <option
              value="BL-01"
              data-num="BL-01"
              data-file="./routes/BL-01-balangoda-town.geojson"
            >
              Balangoda Town
            </option>
            <option
              value="BL-02"
              data-num="BL-02"
              data-file="./routes/BL-02-balangoda-ratnapura.geojson"
            >
              Balangoda Ratnapura
            </option>
            <option
              value="BL-03"
              data-num="BL-03"
              data-file="./routes/BL-03-balangoda-welioya-hambegamuwa.geojson"
            >
              Balangoda Welioya Hambegamuwa
            </option>
            <option
              value="BL-04"
              data-num="BL-04"
              data-file="./routes/BL-04-balangoda-welipatayaya-kaltota.geojson"
            >
              Balangoda Welipatayaya Kaltota
            </option>
            <option
              value="BL-05"
              data-num="BL-05"
              data-file="./routes/BL-05-balangoda-depalamulla-mulgama.geojson"
            >
              Balangoda Depalamulla Mulgama
            </option>
            <option
              value="BL-06"
              data-num="BL-06"
              data-file="./routes/BL-06-balangoda-rajavaka-mulgama.geojson"
            >
              Balangoda Rajavaka Mulgama
            </option>
            <option
              value="BL-07"
              data-num="BL-07"
              data-file="./routes/BL-07-balangoda-samanalawatta.geojson"
            >
              Balangoda Samanalawatta
            </option>
            <option
              value="RT-01"
              data-num="RT-01"
              data-file="./routes/RT-01-ratnapuraTown.geojson"
            >
              Ratnapura Town
            </option>
          </select>
        </div>
      </div>

      <div class="hud-stats">
        <div class="stat-box">
          <span id="speedLabel" class="stat-label">SPEED</span>
          <span id="speedDisplay" class="stat-val">24 km/h</span>
        </div>
        <div class="stat-box">
          <span id="nextStopLabel" class="stat-label">NEXT STOP</span>
          <span id="nextStopDisplay" class="stat-val">Kirimatitenna</span>
        </div>
        <div class="stat-box">
          <span id="statusLabel" class="stat-label">STATUS</span>
          <span id="statusDisplay" class="stat-val status-moving"
            >On Route</span
          >
        </div>
      </div>
    </div>

    <!-- Single-ID Hamburger Menu Trigger -->
    <button
      id="menuToggleBtn"
      class="btn-icon"
      title="Toggle Controls"
      aria-label="Toggle Menu"
    >
      <svg class="icon icon-menu" viewBox="0 0 24 24">
        <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z" />
      </svg>
      <svg class="icon icon-close" viewBox="0 0 24 24">
        <path
          d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"
        />
      </svg>
    </button>

    <!-- Collapsible Control Buttons Popup -->
    <div id="controlPopup" class="control-popup hidden">
      <div class="control-buttons">
        <div class="speed-controller">
          <div class="speed-controller-header">
            <label id="targetSpeedLabel" for="speedSlider">Target Speed</label>
            <span id="speedSliderValue">24 km/h</span>
          </div>
          <input
            id="speedSlider"
            class="speed-slider"
            type="range"
            min="0"
            max="150"
            step="1"
            value="24"
          />
        </div>
        <button id="playPauseBtn" class="btn btn-primary">Pause</button>
        <button id="cameraModeBtn" class="btn btn-secondary">
          Camera: Chase
        </button>
        <button id="busLiveryBtn" class="btn btn-secondary">
          Livery: SLTB
        </button>
        <button id="languageToggleBtn" class="btn btn-secondary">
          Language: English
        </button>
        <button id="themeToggleBtn" class="btn btn-secondary">
          Theme: Dark
        </button>
        <button id="resetBtn" class="btn btn-secondary">Reset</button>
      </div>
    </div>

    <!-- Bottom Progress Bar HUD -->
    <div class="hud-bottom">
      <div class="progress-row">
        <span id="progressText">0.0 / 0.0 km</span>
        <span id="progressPct">0%</span>
      </div>
      <div class="progress-track">
        <div id="progressFill" class="progress-fill"></div>
      </div>
    </div>

    <!-- Cross-Platform Install Prompt Modal -->
    <div id="installModal" class="install-modal hidden">
      <div class="install-card">
        <h3>Install Bus Simulator</h3>
        <p id="installMsg">
          Add this app to your device home screen for the best offline
          experience.
        </p>
        <div class="install-actions">
          <button id="installAppBtn" class="btn btn-primary">Install</button>
          <button id="closeInstallBtn" class="btn btn-secondary">
            Not Now
          </button>
        </div>
      </div>
    </div>

    <!-- Local Offline Libraries -->
    <script src="./lib/pmtiles.js"></script>
    <script src="./lib/maplibre-gl.js"></script>
    <script src="./lib/turf.min.js"></script>
    <script src="./lib/three.min.js"></script>
    <script src="simulator_3d.js"></script>
  </body>
</html>
